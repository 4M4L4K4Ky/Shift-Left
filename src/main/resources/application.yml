spring:
  application:
    name: aegiscode

    flyway:
      enabled: true
      locations: classpath:db/migration


  ai:
    openai:
      base-url: https://generativelanguage.googleapis.com
      chat:
        completions-path: /v1beta/openai/chat/completions
        options:
          model: gpt-4o-mini # O gpt-4o si tu cuenta lo soporta a través de la pasarela
          temperature: 0.2
      api-key: ${GEMINI_API_KEY}