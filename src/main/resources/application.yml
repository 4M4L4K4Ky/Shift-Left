spring:
  application:
    name: aegiscode

    flyway:
      enabled: true
      locations: classpath:db/migration

  ai:
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      api-key: ${GEMINI_API_KEY}
      chat:
        options:
          model: gemini-1.5-flash    # ← era gpt-4o-mini
          temperature: 0.2