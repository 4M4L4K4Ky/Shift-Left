spring:

  application:
    name: aegiscode

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

  ai:
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: llama-3.3-70b-versatile # Modelo LLaMA 3 de 70B, ideal para análisis de código
          temperature: 0.1


app:
  jwt:
    secret: ${JWT_SECRET:a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6a7b8c9d0e1f2a3b4c5d6a7b8c9d0e1f}
    expiration: 86400000
  api:
    client-id: aegiscode-cli
    client-secret: cli-secret-2024
  vcs:
    github:
      token: ${TOKEN:fallback-local-token}