spring:
  datasource:
    url: jdbc:postgresql://db.xduzboonhsilifrdjkzs.supabase.co:5432/postgres?sslmode=require&connectTimeout=30&socketTimeout=30
    username: postgres
    password: ${SUPABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    connect-retries: 3


  ai:
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: llama-3.3-70b-versatile # Modelo LLaMA 3 de 70B, ideal para análisis de código
          temperature: 0.1
