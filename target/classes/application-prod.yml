spring:
  datasource:
    url: jdbc:postgresql://db.vbgsvbewphsdnjhjejuc.supabase.co:5432/postgres?sslmode=require
    username: postgres
    password: ${SUPABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration